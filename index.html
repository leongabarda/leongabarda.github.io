
<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">

<body>

  <header class="header">

  <main>

    <section class="intro">

      <div class="photo photo-top">
        <!-- FOTO 1: sustituye la URL -->
        <img

        <img
          src="URL_DE_TU_FOTO_2"

    <section class="next-section">
      <p class="section-label">INTRO (001)</p>

      <div class="bottom-content">

          LOREM IPSUM DOLOR SIT<br>

        <a

        </a>

  </main>

  <!-- Escudo flotante -->

      class="shield-mask"
      viewBox="0 0 100 110"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M50 5
           C39 15 26 15 14 13
           L10 39
           C5 61 18 81 31 89
           L50 104
           L69 89
           C82 81 95 61 90 39
           L86 13
           C74 15 61 15 50 5 Z"
        fill="white"
      />
    </svg>

    <!-- Sustituye la URL por la del escudo granate -->
    <img
      src="URL_DE_TU_ESCUDO_GRANATE"
      alt=""
      class="shield-logo"
    >

  </div>
